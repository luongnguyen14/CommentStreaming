# conf/log4j2.properties — Cấu hình log riêng cho các lần chạy DEMO.
#
# Vì sao có file này: Spark in vài chục dòng INFO khi khởi động, che mất kết quả
# thử nghiệm trên màn hình. File này chỉ đổi mức log của TIẾN TRÌNH DEMO
# (truyền bằng --driver-java-options trong scripts/run_model_trial.sh);
# KHÔNG sửa $SPARK_HOME/conf (file đó dùng chung cho mọi job).
#
# Mức `warn`: vẫn thấy cảnh báo và lỗi thật, chỉ ẩn INFO.

rootLogger.level = warn
rootLogger.appenderRef.stdout.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n%ex

logger.parquet1.name = org.apache.parquet
logger.parquet1.level = error
logger.parquet2.name = parquet
logger.parquet2.level = error
