# config.yaml — Tham số dùng chung của dự án (CLAUDE.md §3: không hard-code trong script)
#
# Quy ước: mọi script đọc file này. Muối băm và khóa API KHÔNG để ở đây —
# đọc từ biến môi trường (xem scripts/env.sh và README của từng thư mục).

seed: 42                      # mọi bước có yếu tố ngẫu nhiên (CLAUDE.md §3)

paths:
  raw_comments: data/raw/part-01.json          # IMDb Review Dataset - ebD (CC0, xem data/raw/SOURCE.md)
  raw_jsonl: data/processed/imdb_jsonl         # bản newline-delimited JSON để Spark đọc song song
  train: data/processed/train.parquet
  val: data/processed/val.parquet
  test: data/processed/test.parquet
  eval_labels: data/processed/eval_labels.parquet
  outputs_tables: outputs/tables
  outputs_figures: outputs/figures
  logs: logs

# ---------------------------------------------------------------------------
# Nhãn — CHỐT CHÍNH THỨC ở Task 6 (docs/data_dictionary.md §3).
# Dùng chung cho cả prepare (huấn luyện) lẫn producer (nhãn đánh giá).
# Đây là ÁNH XẠ THIẾT KẾ: bộ dữ liệu gốc không có nhãn cảm xúc, chỉ có điểm
# rating 1–10; nhóm quy ước 1–4 = negative, 5–6 = neutral, 7–10 = positive.
# ---------------------------------------------------------------------------
labels:
  mapping:
    negative: [1, 2, 3, 4]
    neutral:  [5, 6]
    positive: [7, 8, 9, 10]
  # Chỉ số lớp dùng trong Spark ML (bộ phân loại cần nhãn dạng số) và trong
  # metadata của PipelineModel đã lưu — streaming đọc lại để dịch số -> tên lớp.
  index:
    negative: 0
    neutral: 1
    positive: 2

# ---------------------------------------------------------------------------
# Làm sạch văn bản (src/common/text_cleaning.py) — DÙNG CHUNG cho huấn luyện
# và streaming, nên mọi thay đổi ở đây ảnh hưởng cả hai phía (CLAUDE.md §4).
# ---------------------------------------------------------------------------
cleaning:
  min_chars: 20               # ngắn hơn -> loại
  max_chars: 5000             # dài hơn -> loại (p90 của dữ liệu ~2.400 ký tự)
  # Từ điển viết tắt / teencode (tiếng Anh — dữ liệu IMDb).
  # Thêm được thoải mái; khóa phải viết thường, được thay theo ranh giới từ.
  abbreviations:
    u: you
    ur: your
    urs: yours
    r: are
    pls: please
    plz: please
    thx: thanks
    tnx: thanks
    ty: thanks
    btw: by the way
    imo: in my opinion
    tbh: to be honest
    idk: i do not know
    wanna: want to
    gonna: going to
    gotta: got to
    cuz: because
    coz: because
    bc: because
    lmk: let me know
    rn: right now
    smh: shaking my head

# ---------------------------------------------------------------------------
# Loại trùng + chia tập (Task 6)
# ---------------------------------------------------------------------------
dedup:
  near_dup: true              # loại cả gần trùng (trùng tập từ sau chuẩn hóa)

split:
  # group_movie_balanced: chia theo NHÓM PHIM (một phim không nằm ở 2 tập)
  # và cân bằng nhãn bằng thuật toán tham lam, seed 42.
  # stratified: chia ngẫu nhiên phân tầng theo nhãn (không nhóm theo phim).
  method: group_movie_balanced
  ratios:
    train: 0.70
    val: 0.15
    test: 0.15

prepare:
  truncate_raw_detail: 20000  # cắt bớt review_detail khi chuyển JSONL (tiết kiệm đĩa)
  # Chỉ dùng một tập con của nguồn cho vừa máy ảo: giữ bản ghi có
  # crc32(review_id) % 1000 < pct * 10 (xem `keep_record` trong prepare.py).
  # TẤT ĐỊNH (chạy lại ra đúng tập con cũ), trải đều theo review_id nên không
  # lệch theo thứ tự phim trong file, và các mức LỒNG NHAU (20% ⊂ 64% ⊂ 100%).
  # ĐO THẬT 15/10/2026 với pct = 64: giữ 646.249/1.010.293 bản ghi (64,0%),
  # JSONL 608,8 MB, sinh mất 24 s (~988 byte/bản ghi). Nguồn 1.045 MB.
  # LƯU Ý: khóa `subsample_mod` (kiểu cũ) cho ra tập con CÙNG CỠ nhưng KHÁC;
  # tập 20% cũ chỉ tái lập được bằng code cũ (git history), không bằng pct: 20.
  subsample_pct: 64
  sample_rows_out: 1000       # số dòng mẫu ghi ra outputs/tables/clean_sample.csv
  emoji_top_n: 30             # số emoji phổ biến nhất ghi ra outputs/tables/emoji_frequency.csv

# ---------------------------------------------------------------------------
# Huấn luyện + đánh giá (Task 7) — src/training/train.py
# ---------------------------------------------------------------------------
training:
  # Vector hóa NẰM TRONG Pipeline để TF-IDF chỉ học trên tập train (CLAUDE.md §6).
  vectorizer:
    vocab_size: 20000     # số từ/ngram giữ lại (chọn theo tần suất tài liệu)
    min_df: 3             # bỏ từ/ngram xuất hiện ở dưới 3 tài liệu
  normalize_l2: true      # chuẩn hóa L2 vector TF-IDF (giúp LR/SVC hội tụ nhanh)
  # Bộ stopword tiếng Anh của Spark có sẵn "not/no/never/n't..." — với bài toán
  # cảm xúc, bỏ chúng là mất tín hiệu ("not good" trái nghĩa "good"), nên giữ lại.
  keep_negations: true
  stopwords_extra: []     # thêm stopword ngoài danh sách mặc định (nếu cần)
  class_weights: balanced # w_c = N / (k * n_c), tính TRÊN TẬP TRAIN
  # Chọn siêu tham số: TrainValidationSplit bên TRONG tập train (không nhìn val/test)
  tvs:
    train_ratio: 0.8
    metric: f1            # weighted F1 — Spark 3.5 không có evaluator macro-F1
  # Lưới siêu tham số từng mô hình (tổ hợp = tích các danh sách con).
  # Thử cả 1-gram và 1-2 gram qua tham số `ngram` (khớp task: "thử cả 1-gram và 1-2 gram").
  grids:
    nb:
      ngram: [1, 2]
      smoothing: [1.0]
    lr:
      ngram: [1, 2]
      reg_param: [0.01, 0.1]
      max_iter: [20]
      elastic_net: [0.0]
    svc:
      ngram: [1]
      reg_param: [0.01, 0.1]
      max_iter: [20]
    rf:
      ngram: [1]
      vocab_size: [5000]  # RF trên 20k đặc trưng thưa rất chậm, không đáng
      num_trees: [30]
      max_depth: [8, 12]
  top_features_n: 20      # số từ có trọng số lớn nhất mỗi lớp ghi ra bảng/hình
  error_n: 30             # số bình luận dự đoán sai lấy ra phân tích lỗi
  model_out: outputs/models/sentiment_pipeline
  leakage_threshold_macro_f1: 0.95   # vượt ngưỡng này -> dừng, nghi rò rỉ (task 7.6)
  # Ngưỡng cho các quy tắc gán nhóm nguyên nhân trong error_analysis.csv
  error_rules:
    short_chars: 80
    sarcasm_markers: ["yeah right", "oh sure", "just great", "how original", "sure thing", "go figure", "wow just wow"]
    negation_markers: ["not", "n't", "no", "never", "nothing", "nobody", "without", "hardly", "barely"]
    contrast_markers: ["but", "however", "although", "though", "yet", "unfortunately", "except"]

kafka:
  bootstrap_servers: localhost:9092
  topic_raw: comments_raw
  topic_scored: comments_scored
  topic_dlq: comments_dlq
  producer:
    acks: all
    linger_ms: 20             # gom lô nhỏ để tăng thông lượng (đo ở outputs/tables/ingestion_report.csv)

# ---------------------------------------------------------------------------
# Spark Structured Streaming (Task 8) — src/streaming/stream_job.py
# ---------------------------------------------------------------------------
streaming:
  # Nguồn: topic kafka.topic_raw. startingOffsets nhận:
  #   latest   — chỉ xử lý bản ghi đến SAU khi query khởi động (đúng cho demo trực tiếp)
  #   earliest — phát lại toàn bộ topic từ đầu
  #   chuỗi JSON {"comments_raw":{"0":7900,"1":7901,"2":7902}} — bắt đầu từ offset
  #              chính xác (tái lập được; lấy bằng kafka-get-offsets.sh)
  starting_offsets: latest
  max_offsets_per_trigger: 5000   # trần số bản ghi mỗi micro-batch (chống dồn ứ)
  trigger_seconds: 10             # chu kỳ micro-batch (processingTime trigger)
  # Watermark = mốc muộn tối đa chấp nhận cho dữ liệu sự kiện. Chọn 2 phút vì
  # replay.late_max_s = 30 s (độ trễ giả lập tối đa) → 2 phút là 4× biên an toàn;
  # đồng thời chặn kích thước state của phép gộp cửa sổ. Hệ quả phải nói rõ:
  # kết quả một cửa sổ chỉ được ghi ra sau khi cửa sổ ĐÓNG + watermark (với cửa sổ
  # 1 phút ⇒ chậm nhất ~3 phút sau khi cửa sổ kết thúc).
  watermark: "2 minutes"
  window_duration: "1 minute"
  sliding_window_duration: "10 seconds"
  sliding_window_slide: "5 seconds"   # slide < duration ⇒ cửa sổ TRƯỢT thật sự
  checkpoint_root: checkpoints/streaming
  sink_root: outputs/stream
  privacy:
    keep_text: false      # false = KHÔNG giữ văn bản trong bảng chi tiết (mặc định)
  dlq:
    to_kafka: true        # bản ghi lỗi -> topic kafka.topic_dlq (kèm lý do)
    to_parquet: true      # bản sao -> <sink>/dlq để đối chiếu số lượng
  batch_log: outputs/tables/stream_batches.csv   # StreamingQueryListener ghi mỗi micro-batch

replay:
  # Ánh xạ cột trong part-01.json -> trường của message JSON gửi Kafka.
  # Message chỉ gồm: comment_id, stream_id, user_hash, text, event_ts (KHÔNG có nhãn).
  id_field: review_id         # -> comment_id
  stream_field: movie         # -> stream_id (dùng tên phim làm "phòng live" thay thế)
  user_field: reviewer        # -> user_hash (băm có muối, KHÔNG gửi bản gốc)
  text_field: review_detail   # -> text (khớp cột `text` của tập huấn luyện)

  rate: 50                    # bình luận/giây (0 = không giới hạn tốc độ)
  burst_prob: 0.02            # xác suất bắt đầu một đợt bùng nổ
  burst_factor: 8             # trong đợt bùng nổ, tốc độ tăng gấp bấy nhiêu lần
  burst_len_s: 2.0            # độ dài mỗi đợt bùng nổ (giây)
  late_ratio: 0.05            # tỷ lệ bản ghi có event_ts bị đẩy trễ (thử watermark)
  late_max_s: 30              # mức trễ tối đa của bản ghi đến muộn (giây)

# ---------------------------------------------------------------------------
# EDA — truy vấn, insight, trực quan hóa (Task 9) — src/eda/queries.py + plots.py
# ---------------------------------------------------------------------------
eda:
  # Lần chạy streaming lấy dữ liệu phân tích. Đổi tên này là đổi cả hình 10–13
  # và bảng eda_* tương ứng (mọi script đều đọc từ đây, không hard-code).
  streaming_run: verify1
  top_words_n: 20             # số từ đặc trưng nhất mỗi lớp (hình 08)
  top_words_min_count: 20     # bỏ từ xuất hiện < mức này TRONG LỚP (chống từ hiếm)
  log_odds_prior: 1000        # alpha_0 của log-odds có prior Dirichlet (Monroe 2008)
  emoji_per_class_n: 12       # số emoji nhiều nhất mỗi lớp (hình 09)
  length_bin_width: 25        # bề rộng mỗi khoảng độ dài, đơn vị token (hình 07)
  length_bin_max: 400         # gộp mọi bình luận dài hơn vào khoảng cuối
  latency_bins_per_decade: 5  # số khoảng trong mỗi bậc 10× của độ trễ (hình 13)
  # stream_id do scripts/send_bad_events.py tạo ra khi kiểm chứng (KHÔNG phải
  # dữ liệu replay thật). Dùng để ĐÁNH DẤU trong hình, không để lọc bỏ.
  synthetic_stream_ids: ["heartbeat", "stream-test"]
  alert:
    # Ngưỡng cảnh báo tỷ lệ tiêu cực. Căn cứ: tỷ lệ lớp negative đo trên tập
    # test = 0,2506 (outputs/tables/class_distribution.csv) + biên 5 điểm phần
    # trăm. Cửa sổ có ít hơn `min_comments` bình luận KHÔNG được cảnh báo, vì
    # 1 bình luận tiêu cực cũng cho tỷ lệ 100% (đã thấy thật ở Task 8).
    negative_share_threshold: 0.30
    min_comments: 5
    basis: "ty le negative tren tap test 0.2506 + bien 5 diem phan tram"
  burst:
    # Bùng nổ = giây có số bình luận > mean + sigma * std của chính lần chạy.
    # Kèm đường tham chiếu "trần lý thuyết" = replay.rate * replay.burst_factor.
    sigma: 2.0

# ---------------------------------------------------------------------------
# Dashboard gần thời gian thực (Task 10) — src/app/app.py
# ---------------------------------------------------------------------------
dashboard:
  # Lần chạy streaming mà dashboard đọc. `demo` là tên riêng của Task 10 (do
  # scripts/run_demo.sh tạo) — KHÔNG dùng lại `verify1` để số liệu kiểm chứng của
  # Task 8/9 không bị lẫn với dữ liệu demo. Nếu thư mục chưa có, dashboard báo rõ
  # và cho chọn lần chạy khác trong sidebar.
  streaming_run: demo
  refresh_seconds: 5          # nhịp tự làm mới tab Live Monitor
  recent_minutes: 30          # số phút gần nhất đưa lên biểu đồ theo phút
  latest_comments_n: 10       # số bình luận mới nhất hiển thị (đã che)
  # Cửa sổ "hiện tại" để tính tỷ lệ cảm xúc và xét cảnh báo (giây).
  current_window_s: 30
  # Danh sách che từ nhạy cảm khi hiển thị bình luận. ĐÂY LÀ DANH SÁCH MINH HOẠ để
  # chứng minh cơ chế — danh sách đầy đủ phải do người kiểm duyệt cung cấp. So khớp
  # theo ranh giới từ, không phân biệt hoa/thường; từ bị thay bằng ***.
  mask_words:
    - idiot
    - stupid
    - moron
    - garbage
    - trash
  # Mẫu bổ sung luôn che (định dạng thật của dữ liệu, không phải từ vựng).
  mask_patterns:
    - '[\w.+-]+@[\w-]+\.[\w.]+'          # email
    - '\b(?:\+?\d[\d .-]{7,}\d)\b'        # số điện thoại (>= 9 chữ số)
  # Câu ví dụ cho tab "Try It" (bấm là điền vào ô nhập).
  try_it_examples:
    - "not bad at all actually, quite enjoyable"
    - "it was okay, nothing special. 6/10"
    - "the acting is good. the story is very much lacking"
    - "his 'bad acting' had me crying with laughter, absolutely brilliant"
